# CPU smoke test. Tiny random weights, a few steps, not a quality run.
model_name_or_path: hf-internal-testing/tiny-random-LlamaForCausalLM
dataset_path: data/synthetic/maintenance_logs.jsonl
output_dir: outputs/smoke-lora
max_steps: 2
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
max_length: 512
lora_r: 4
lora_alpha: 8
lora_dropout: 0.0
target_modules:
  - q_proj
  - v_proj
seed: 7
logging_steps: 1
save_strategy: "no"
eval_strategy: "no"
use_cpu: true
chat_template: plain
train_split: train
