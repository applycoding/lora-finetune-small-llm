[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-finetune-small-llm"
version = "0.1.0"
description = "Portfolio demo: LoRA fine-tuning pipeline that turns maintenance logs into JSON."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arpan Bom", email = "applycoding@gmail.com" }]
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "gradio>=4.44",
    "peft>=0.13",
    "protobuf>=4.25",
    "pyyaml>=6",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.46",
    "trl>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
